services:
  s2pendgeo:
    image: ${DOCKER_IMAGE:-alphabloo7/s2pendgeo:latest}
    container_name: s2pendgeo-web
    restart: always
    ports:
      - "8085:80" # Sesuaikan port host yang diinginkan di server VPS Anda
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
